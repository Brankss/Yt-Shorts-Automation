<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <title>Would You Rather — episode template</title>
    <!-- Vendored, not CDN: a render-time network fetch is banned by the
         determinism rules and fails closed in a sandboxed renderer. -->
    <script src="vendor/gsap.min.js"></script>
    <style>
      /* Values mirror dna/video-dna.json 3.2.0. The DNA is authoritative:
         if these drift from it, these are wrong. */

      /* Roboto Black Italic, embedded from the file rather than named. Roboto
         is one of the renderer's bundled families, but the bundle carries the
         weights it carries — asking for a cut it does not ship gives a
         synthetic approximation, not the real one. The file removes the
         question. It also means the slant is the typeface's own italic and not
         a skew, which is why there is no transform on the text any more. */
      @font-face {
        font-family: "Roboto Black Italic";
        src: url("assets/fonts/roboto-latin-900-italic.woff2") format("woff2");
        font-weight: 900;
        font-style: italic;
        font-display: block;
      }
      :root {
        --a: #ff1e1e;
        --b: #0a84ff;
        --text: #fff;
        --stroke: #000;
      }

      body { margin: 0; background: #000; }

      #root {
        position: relative;
        width: 1080px;
        height: 1920px;
        overflow: hidden;
        color: var(--text);
      }

      /* Two fields, edge to edge, split at the middle. No background sits
         behind them and nothing frames them. */
      .field { position: absolute; left: 0; width: 1080px; height: 960px; }
      #field-a { top: 0;    background: var(--a); }
      #field-b { top: 960px; background: var(--b); }

      .clip { position: absolute; inset: 0; }

      /* The seam. It is the only line in the frame, and during a timer it
         breathes once per second — the countdown made visible without a
         countdown being drawn. */
      #seam {
        position: absolute;
        left: 0;
        top: 955px;
        width: 1080px;
        height: 10px;
        background: #000;
        transform-origin: center center;
      }

      /* The pulse is carried by this, not by the line. A vertical gradient
         fading to nothing at both edges has no edge to catch the eye, so the
         beat registers as light rather than as movement. The line itself barely
         moves — thickening it is what made the first version feel like a flash
         instead of a breath. */
      #seam-glow {
        position: absolute;
        left: 0;
        top: 925px;
        width: 1080px;
        height: 70px;
        opacity: 0;
        background: linear-gradient(
          to bottom,
          rgba(255, 255, 255, 0) 0%,
          rgba(255, 255, 255, 0.75) 50%,
          rgba(255, 255, 255, 0) 100%
        );
      }

      /* The disc on the seam is the only other chrome in the format. */
      #or {
        position: absolute;
        left: 462px;
        top: 882px;
        width: 156px;
        height: 156px;
        border-radius: 999px;
        background: #000;
        display: grid;
        place-items: center;
        font: italic 900 54px/1 "Roboto Black Italic", Roboto, Arial, sans-serif;
        letter-spacing: 0.02em;
      }

      .cap {
        position: absolute;
        left: 90px;
        width: 900px;
        height: 220px;
        display: grid;
        place-items: center;
      }
      #cap-a-box { top: 680px; }
      #cap-b-box { top: 1020px; }

      .cap-text {
        display: block;
        font: italic 900 96px/1.05 "Roboto Black Italic", Roboto, Arial, sans-serif;
        text-transform: lowercase;
        text-align: center;
        color: var(--text);
        -webkit-text-stroke: 6px var(--stroke);
        paint-order: stroke fill;
      }

      .imgbox {
        position: absolute;
        left: 330px;
        width: 420px;
        height: 420px;
        display: grid;
        place-items: center;
      }
      #img-a-box { top: 210px; }
      #img-b-box { top: 1240px; }
      /* Fixed size, not max-*: the source SVGs carry small intrinsic
         dimensions, and a max-only rule constrains without ever scaling up. */
      .imgbox img { width: 420px; height: 420px; object-fit: contain; display: block; }

      /* Only drawn when a block has no image. The DNA requires one per option,
         so this is meant to be visible and wrong, not a shippable state. */
      .slot {
        width: 380px;
        height: 380px;
        border: 6px dashed rgba(255, 255, 255, 0.55);
        border-radius: 24px;
      }

      .scrim { position: absolute; left: 0; width: 1080px; height: 960px; background: #000; }
      #scrim-a { top: 0; }
      #scrim-b { top: 960px; }

      .pct {
        position: absolute;
        left: 90px;
        width: 900px;
        text-align: center;
        font: italic 900 190px/1 "Roboto Black Italic", Roboto, Arial, sans-serif;
        color: var(--text);
        -webkit-text-stroke: 8px var(--stroke);
        paint-order: stroke fill;
      }
      #pct-a { top: 325px; }
      #pct-b { top: 1355px; }

      /* One word, sitting across the seam. Nothing else is on screen. */
      #end-a {
        position: absolute;
        left: 40px;
        top: 848px;
        width: 1000px;
        text-align: center;
        font: italic 900 170px/1 "Roboto Black Italic", Roboto, Arial, sans-serif;
        letter-spacing: -0.02em;
        color: var(--text);
        -webkit-text-stroke: 8px var(--stroke);
        paint-order: stroke fill;
      }
    </style>

    <script>
      // Static JSON in, fixed DOM out. No clocks, no randomness, no network:
      // the same episode file always produces the same frames.
      const T = { enter: 0.35, reveal: 0.4, exit: 0.35 };

      // The island is wrapped in the builder's marker comments. Slice to the
      // outermost braces rather than stripping them with a regex: an HTML
      // comment delimiter written literally inside a <script> hits the parser's
      // legacy comment handling and breaks the whole block.
      const raw = document.getElementById("episode-data").textContent;
      const data = JSON.parse(raw.slice(raw.indexOf("{"), raw.lastIndexOf("}") + 1));
      document.getElementById("end-a").textContent = data.end_card.cta;

      // One pulse of the seam per second of every tick. Written as a pair of
      // tweens rather than a repeating one: a repeat would not survive seeking,
      // and the renderer seeks every frame.
      function pulse(at) {
        // Asymmetric and slow enough to read as breathing: in over 0.28s, out
        // over 0.5s, sine both ways so neither end has a corner in it. Well
        // inside the one-second gap, so two pulses never overlap.
        tlPulse.fromTo("#seam-glow", { opacity: 0 },
          { opacity: 0.85, duration: 0.28, ease: "sine.inOut" }, at);
        tlPulse.to("#seam-glow", { opacity: 0, duration: 0.5, ease: "sine.inOut" }, at + 0.28);
        tlPulse.to("#seam", { scaleY: 1.35, duration: 0.28, ease: "sine.inOut" }, at);
        tlPulse.to("#seam", { scaleY: 1, duration: 0.5, ease: "sine.inOut" }, at + 0.28);
      }

      function caption(side, text) {
        const box = document.createElement("div");
        box.className = "cap";
        box.id = "cap-" + side + "-box";
        const span = document.createElement("span");
        span.className = "cap-text";
        span.textContent = text;
        box.appendChild(span);
        return box;
      }

      function image(side, src) {
        const box = document.createElement("div");
        box.className = "imgbox";
        box.id = "img-" + side + "-box";
        if (src) {
          const img = document.createElement("img");
          img.src = src;
          img.alt = "";
          box.appendChild(img);
        } else {
          const slot = document.createElement("div");
          slot.className = "slot";
          box.appendChild(slot);
        }
        return box;
      }

      function layer(cls, side) {
        const el = document.createElement("div");
        el.className = cls;
        el.id = cls.replace(".", "") + "-" + side;
        return el;
      }

      data.blocks.forEach((block, i) => {
        const s = document.getElementById("b" + (i + 1));
        // DOM order is z-order: pictures, then words, then the darkening, then
        // the numbers — which stay readable on the losing side too.
        s.append(
          image("a", block.image_a),
          caption("a", block.option_a),
          image("b", block.image_b),
          caption("b", block.option_b),
          layer("scrim", "a"),
          layer("scrim", "b"),
          layer("pct", "a"),
          layer("pct", "b")
        );
      });

      const tl = gsap.timeline({ paused: true });
      const tlPulse = tl;
      const q = (i, sel) => "#b" + (i + 1) + " " + sel;

      data.blocks.forEach((block, i) => {
        const t0 = block.timing.start;
        const tR = block.timing.reveal_at;
        const tE = t0 + block.timing.length - T.exit;
        const winner = block.reveal.a >= block.reveal.b ? "a" : "b";

        // Each side arrives on the word that names it. The screen never shows
        // an option the voice has not reached yet, so the viewer reads exactly
        // what they are hearing and the frame fills as the question is asked.
        [["a", block.timing.a_at, -60], ["b", block.timing.b_at, 60]].forEach(
          ([side, at, from]) => {
            tl.fromTo(q(i, "#cap-" + side + "-box"), { y: from, autoAlpha: 0 },
              { y: 0, autoAlpha: 1, duration: T.enter, ease: "power3.out" }, at);
            tl.fromTo(q(i, "#img-" + side + "-box"), { scale: 0.88, autoAlpha: 0 },
              { scale: 1, autoAlpha: 1, duration: T.enter, ease: "power3.out" }, at);
          });

        // The disc lands on the word "or" — it is the only thing on screen that
        // means "these two are alternatives", so it arrives when that is said.
        tl.set("#or", { autoAlpha: 0 }, t0);
        tl.fromTo("#or", { scale: 0.7, autoAlpha: 0 },
          { scale: 1, autoAlpha: 1, duration: 0.25, ease: "back.out(2.4)" }, block.timing.b_at);

        // Then nothing moves. The voice asks, the tick runs its five seconds,
        // and the viewer chooses. No on-screen countdown competes with either.
        gsap.set([q(i, "#scrim-a"), q(i, "#scrim-b")], { autoAlpha: 0 });

        ["a", "b"].forEach((side) => {
          const won = side === winner;
          const pctEl = document.querySelector(q(i, "#pct-" + side));
          const value = block.reveal[side];

          // The picture drops back so the number reads over it.
          tl.to(q(i, "#img-" + side + "-box"),
            { autoAlpha: 0.35, duration: T.reveal, ease: "power2.out" }, tR);

          const counter = { v: 0 };
          tl.fromTo(pctEl, { scale: 1.35, autoAlpha: 0 },
            { scale: 1, autoAlpha: 1, duration: T.reveal, ease: "back.out(2)" }, tR);
          tl.to(counter, {
            v: value,
            duration: T.reveal,
            ease: "none",
            onUpdate: () => { pctEl.textContent = Math.round(counter.v) + "%"; },
          }, tR);

          if (!won) {
            tl.to(q(i, "#scrim-" + side),
              { autoAlpha: 0.45, duration: T.reveal, ease: "power2.out" }, tR);
          }
        });

        block.timing.pulses.forEach(pulse);

        // Exit: hard push, no transition effect.
        tl.to(q(i, "#cap-a-box"), { y: -60, autoAlpha: 0, duration: T.exit, ease: "power2.in" }, tE);
        tl.to(q(i, "#cap-b-box"), { y: 60, autoAlpha: 0, duration: T.exit, ease: "power2.in" }, tE);
        tl.to(q(i, "#img-a-box") + ", " + q(i, "#img-b-box") + ", " + q(i, "#pct-a") + ", " + q(i, "#pct-b"),
          { autoAlpha: 0, duration: T.exit, ease: "power2.in" }, tE);
      });

      // End card: the same two fields, one word, and the tick still running.
      // The last frame carries the split the first frame opened on, so the
      // loop closes on itself.
      tl.fromTo("#end-a", { scale: 1.3, autoAlpha: 0 },
        { scale: 1, autoAlpha: 1, duration: 0.35, ease: "back.out(2)" }, data.end_card.at);
      data.end_card.pulses.forEach(pulse);

      window.__timelines["main"] = tl;
    </script>
  </body>
</html>
