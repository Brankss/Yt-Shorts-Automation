<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <title>Would You Rather — episode template</title>
    <!-- Vendored, not CDN: a render-time network fetch is banned by the
         determinism rules and fails closed in a sandboxed renderer. -->
    <script src="vendor/gsap.min.js"></script>
    <style>
      /* Values mirror dna/video-dna.json 2.0.0. The DNA is authoritative:
         if these drift from it, these are wrong. */
      :root {
        --a: #ff1e1e;
        --b: #0a84ff;
        --text: #fff;
        --stroke: #000;
      }

      body { margin: 0; background: #000; }

      #root {
        position: relative;
        width: 1080px;
        height: 1920px;
        overflow: hidden;
        color: var(--text);
      }

      /* Two fields, edge to edge, split at the middle. No background sits
         behind them and nothing frames them. */
      .field { position: absolute; left: 0; width: 1080px; height: 960px; }
      #field-a { top: 0;    background: var(--a); }
      #field-b { top: 960px; background: var(--b); }

      .clip { position: absolute; inset: 0; }

      /* The disc on the seam is the only chrome in the format. */
      #or {
        position: absolute;
        left: 462px;
        top: 882px;
        width: 156px;
        height: 156px;
        border-radius: 999px;
        background: #000;
        display: grid;
        place-items: center;
        font: 900 54px/1 Nunito, "Trebuchet MS", Verdana, sans-serif;
        letter-spacing: 0.02em;
      }

      .cap {
        position: absolute;
        left: 90px;
        width: 900px;
        height: 220px;
        display: grid;
        place-items: center;
      }
      #cap-a-box { top: 680px; }
      #cap-b-box { top: 1020px; }

      /* The skew is a static CSS transform on an inner element. The wrapper is
         what animates, so no tween ever fights it. */
      .cap-text {
        display: block;
        transform: skewX(-8deg);
        font: 900 96px/1.05 Nunito, "Trebuchet MS", Verdana, sans-serif;
        text-transform: lowercase;
        text-align: center;
        color: var(--text);
        -webkit-text-stroke: 10px var(--stroke);
        paint-order: stroke fill;
      }

      .imgbox {
        position: absolute;
        left: 330px;
        width: 420px;
        height: 420px;
        display: grid;
        place-items: center;
      }
      #img-a-box { top: 210px; }
      #img-b-box { top: 1240px; }
      /* Fixed size, not max-*: the source SVGs carry small intrinsic
         dimensions, and a max-only rule constrains without ever scaling up. */
      .imgbox img { width: 420px; height: 420px; object-fit: contain; display: block; }

      /* Only drawn when a block has no image. The DNA requires one per option,
         so this is meant to be visible and wrong, not a shippable state.
         Deliberately textless: a label here would sit under the percentage and
         trip the overlap and contrast gates on a condition that cannot occur
         once a real image is in the slot. */
      .slot {
        width: 380px;
        height: 380px;
        border: 6px dashed rgba(255, 255, 255, 0.55);
        border-radius: 24px;
      }

      .scrim { position: absolute; left: 0; width: 1080px; height: 960px; background: #000; }
      #scrim-a { top: 0; }
      #scrim-b { top: 960px; }

      .pct {
        position: absolute;
        left: 90px;
        width: 900px;
        text-align: center;
        font: 900 190px/1 Nunito, "Trebuchet MS", Verdana, sans-serif;
        color: var(--text);
        -webkit-text-stroke: 12px var(--stroke);
        paint-order: stroke fill;
      }
      #pct-a { top: 325px; }
      #pct-b { top: 1355px; }
      .pct--label { font-size: 76px; -webkit-text-stroke-width: 8px; }

      #end-a, #end-b {
        position: absolute;
        left: 90px;
        width: 900px;
        text-align: center;
        font: 900 84px/1.1 Nunito, "Trebuchet MS", Verdana, sans-serif;
        text-transform: lowercase;
        color: var(--text);
        -webkit-text-stroke: 10px var(--stroke);
        paint-order: stroke fill;
      }
      #end-a { top: 600px; }
      #end-b { top: 1120px; }
    </style>
  </head>
  <body>
    <!-- Content slots. A build step replaces this island and nothing else;
         the split, the timing and the type never vary between episodes.
         Shape: content/schemas/episode.schema.json

         The screen shows only the two fragments. The stem that makes them a
         question is spoken, never rendered — which is why the voiceover is
         required rather than optional. -->
    <script type="application/json" id="episode-data">
      {
        "episode": 7,
        "blocks": [
          {
            "dilemma_id": "d0001",
            "stem": "Would you rather eat pizza with",
            "option_a": "pineapple",
            "option_b": "anchovies",
            "image_a": "assets/noto-pineapple.svg",
            "image_b": "assets/noto-fish.svg",
            "reveal": { "source": "community_poll", "a": 71, "b": 29 }
          },
          {
            "dilemma_id": "d0012",
            "stem": "Would you rather give up",
            "option_a": "chocolate",
            "option_b": "cheese",
            "image_a": "assets/noto-chocolate-bar.svg",
            "image_b": "assets/noto-cheese-wedge.svg",
            "reveal": { "source": "community_poll", "a": 58, "b": 42 }
          },
          {
            "dilemma_id": "d0022",
            "stem": "Would you rather give up",
            "option_a": "meat forever",
            "option_b": "sugar forever",
            "image_a": "assets/noto-cut-of-meat.svg",
            "image_b": "assets/noto-candy.svg",
            "reveal": { "source": "community_poll", "a": 64, "b": 36 }
          },
          {
            "dilemma_id": "d0031",
            "stem": "Would you rather lose your sense of",
            "option_a": "taste",
            "option_b": "smell",
            "image_a": "assets/noto-tongue.svg",
            "image_b": "assets/noto-nose.svg",
            "reveal": { "source": "prediction_no_number", "prediction_favours": "b" }
          },
          {
            "dilemma_id": "d0041",
            "stem": "Would you rather never feel",
            "option_a": "hunger again",
            "option_b": "full again",
            "image_a": "assets/noto-drooling-face.svg",
            "image_b": "assets/noto-face-savoring-food.svg",
            "reveal": { "source": "community_poll", "a": 83, "b": 17 }
          }
        ],
        "end_card": {
          "cta": "vote on the next five",
          "next_teaser": "results in episode 8"
        }
      }
    </script>

    <div
      id="root"
      data-composition-id="main"
      data-start="0"
      data-width="1080"
      data-height="1920"
      data-duration="46"
    >
      <div id="field-a" class="field"></div>
      <div id="field-b" class="field"></div>

      <!-- Five blocks of 8.5s. The duration is not a style choice: 16-25s
           videos median 751 views in this niche against 26,239 for 41-60s. -->
      <section id="b1" class="clip" data-start="0"    data-duration="8.5"></section>
      <section id="b2" class="clip" data-start="8.5"  data-duration="8.5"></section>
      <section id="b3" class="clip" data-start="17"   data-duration="8.5"></section>
      <section id="b4" class="clip" data-start="25.5" data-duration="8.5"></section>
      <section id="b5" class="clip" data-start="34"   data-duration="8.5"></section>

      <section id="or-holder" class="clip" data-start="0" data-duration="42.5">
        <div id="or">OR</div>
      </section>

      <section id="end" class="clip" data-start="42.5" data-duration="3.5">
        <div id="end-a">vote on the next five</div>
        <div id="end-b">results in episode 8</div>
      </section>
    </div>

    <script>
      // Static JSON in, fixed DOM out. No clocks, no randomness, no network:
      // the same episode file always produces the same frames.
      const T = {
        block: 8.5,
        enter: 0.35,
        revealAt: 4.0,
        revealDur: 0.4,
        exitAt: 8.15,
        exitDur: 0.35,
      };

      const data = JSON.parse(document.getElementById("episode-data").textContent);
      document.getElementById("end-a").textContent = data.end_card.cta;
      document.getElementById("end-b").textContent = data.end_card.next_teaser || "";

      function caption(side, i, text) {
        const box = document.createElement("div");
        box.className = "cap";
        box.id = "cap-" + side + "-box";
        const span = document.createElement("span");
        span.className = "cap-text";
        span.dataset.slot = "block" + (i + 1) + ".option_" + side;
        span.textContent = text;
        box.appendChild(span);
        return box;
      }

      function image(side, i, src) {
        const box = document.createElement("div");
        box.className = "imgbox";
        box.id = "img-" + side + "-box";
        if (src) {
          const img = document.createElement("img");
          img.src = src;
          img.alt = "";
          box.appendChild(img);
        } else {
          // Loud on purpose: the DNA requires an image per option.
          const slot = document.createElement("div");
          slot.className = "slot";
          box.appendChild(slot);
        }
        return box;
      }

      function scrim(side) {
        const el = document.createElement("div");
        el.className = "scrim";
        el.id = "scrim-" + side;
        return el;
      }

      function percent(side) {
        const el = document.createElement("div");
        el.className = "pct";
        el.id = "pct-" + side;
        return el;
      }

      data.blocks.forEach((block, i) => {
        const s = document.getElementById("b" + (i + 1));
        // DOM order is z-order: pictures, then words, then the darkening, then
        // the numbers — which stay readable on the losing side too.
        s.append(
          image("a", i, block.image_a),
          caption("a", i, block.option_a),
          image("b", i, block.image_b),
          caption("b", i, block.option_b),
          scrim("a"),
          scrim("b"),
          percent("a"),
          percent("b")
        );
      });

      const tl = gsap.timeline({ paused: true });
      const q = (i, sel) => "#b" + (i + 1) + " " + sel;

      data.blocks.forEach((block, i) => {
        const t0 = i * T.block;
        const poll = block.reveal.source === "community_poll";
        const winner = poll
          ? block.reveal.a >= block.reveal.b ? "a" : "b"
          : block.reveal.prediction_favours;

        // Enter: words push toward the seam, pictures settle in.
        tl.fromTo(q(i, "#cap-a-box"), { y: -60, autoAlpha: 0 },
          { y: 0, autoAlpha: 1, duration: T.enter, ease: "power3.out" }, t0);
        tl.fromTo(q(i, "#cap-b-box"), { y: 60, autoAlpha: 0 },
          { y: 0, autoAlpha: 1, duration: T.enter, ease: "power3.out" }, t0);
        tl.fromTo(q(i, "#img-a-box") + ", " + q(i, "#img-b-box"),
          { scale: 0.88, autoAlpha: 0 },
          { scale: 1, autoAlpha: 1, duration: T.enter, ease: "power3.out" }, t0);

        // Nothing moves during the decide phase. The voice asks the question;
        // an on-screen timer would only compete with it.
        gsap.set([q(i, "#scrim-a"), q(i, "#scrim-b")], { autoAlpha: 0 });

        const tR = t0 + T.revealAt;

        ["a", "b"].forEach((side) => {
          const won = side === winner;
          const pctEl = document.querySelector(q(i, "#pct-" + side));
          const value = poll ? (side === "a" ? block.reveal.a : block.reveal.b) : null;

          // The picture drops back so the number reads over it.
          tl.to(q(i, "#img-" + side + "-box"),
            { autoAlpha: 0.35, duration: T.revealDur, ease: "power2.out" }, tR);

          if (poll) {
            const counter = { v: 0 };
            tl.fromTo(pctEl, { scale: 1.35, autoAlpha: 0 },
              { scale: 1, autoAlpha: 1, duration: T.revealDur, ease: "back.out(2)" }, tR);
            tl.to(counter, {
              v: value,
              duration: T.revealDur,
              ease: "none",
              onUpdate: () => { pctEl.textContent = Math.round(counter.v) + "%"; },
            }, tR);
          } else if (won) {
            // Episode 1 has no poll behind it, so the block names a favourite
            // and shows no number rather than inventing one.
            pctEl.className = "pct pct--label";
            pctEl.textContent = "most people";
            tl.fromTo(pctEl, { scale: 1.35, autoAlpha: 0 },
              { scale: 1, autoAlpha: 1, duration: T.revealDur, ease: "back.out(2)" }, tR);
          }

          if (!won) {
            tl.to(q(i, "#scrim-" + side),
              { autoAlpha: 0.45, duration: T.revealDur, ease: "power2.out" }, tR);
          }
        });

        // Exit: hard push, no transition effect.
        const tE = t0 + T.exitAt;
        tl.to(q(i, "#cap-a-box"), { y: -60, autoAlpha: 0, duration: T.exitDur, ease: "power2.in" }, tE);
        tl.to(q(i, "#cap-b-box"), { y: 60, autoAlpha: 0, duration: T.exitDur, ease: "power2.in" }, tE);
        tl.to(q(i, "#img-a-box") + ", " + q(i, "#img-b-box") + ", " + q(i, "#pct-a") + ", " + q(i, "#pct-b"),
          { autoAlpha: 0, duration: T.exitDur, ease: "power2.in" }, tE);
      });

      // End card: same two fields, copy only. The last frame carries the split
      // the first frame opened on, so the loop is seamless.
      tl.fromTo("#end-a", { y: -40, autoAlpha: 0 },
        { y: 0, autoAlpha: 1, duration: 0.4, ease: "power3.out" }, 42.7);
      tl.fromTo("#end-b", { y: 40, autoAlpha: 0 },
        { y: 0, autoAlpha: 1, duration: 0.4, ease: "power3.out" }, 42.8);

      window.__timelines["main"] = tl;
    </script>
  </body>
</html>
